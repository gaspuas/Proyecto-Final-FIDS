
{% extends "base.html" %}

{% block title %}Ingresar · Cine Paradiso{% endblock %}

{% block content %}

<section class="autenticacion">

    <div class="autenticacion__tarjeta">
        <h2>Iniciar sesión</h2>

        <form method="POST">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" name="email" required>

            <label for="login-password">Contraseña</label>
            <input type="password" id="login-password" name="password" required>

            <button type="submit" class="boton">Ingresar</button>
        </form>
    </div>

    <div class="autenticacion__tarjeta">
        <h2>Crear cuenta</h2>

        <form method="POST">
            <label for="registro-nombre">Nombre</label>
            <input type="text" id="registro-nombre" name="nombre" required>

            <label for="registro-email">Email</label>
            <input type="email" id="registro-email" name="email" required>

            <label for="registro-password">Contraseña</label>
            <input type="password" id="registro-password" name="password" required>

            <button type="submit" class="boton boton--secundario">Registrarme</button>
        </form>
    </div>

</section>

{% endblock %}
